<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#2a0c00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Чакры — путь йога</title>
    <style>
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:4vh 6vw;background:radial-gradient(circle at 50% 40%,#7a3200,#2a0b00 62%,#120300);color:#ffe082;font-family:Georgia,'Times New Roman',serif;text-align:center;transition:opacity .6s ease;user-select:none;-webkit-user-select:none}
#boot.hide{opacity:0;pointer-events:none}
.sw-svg{width:min(48vh,64vw);height:min(48vh,64vw);filter:drop-shadow(0 6px 14px #000a)}
@media (max-height:480px){.sw-svg{width:min(52vh,40vw);height:min(52vh,40vw)}}
@keyframes swr{to{transform:rotate(360deg)}}
@keyframes swl{to{transform:rotate(-360deg)}}
.sw-rot{animation:swr 7s linear infinite;transform-origin:0 0}
.sw-rev{animation:swl 26s linear infinite;transform-origin:0 0}
.sw-title{font-size:clamp(20px,4.2vh,38px);color:#ffe9a0;text-shadow:0 2px 4px #000;letter-spacing:.02em}
.sw-sub{font-size:clamp(12px,2vh,17px);color:#ffcc80;opacity:.85;letter-spacing:.3em;text-transform:uppercase}
.sw-bar{position:relative;width:min(420px,70vw);height:12px;border-radius:99px;background:#120300;border:1.5px solid #ffb300aa;box-shadow:inset 0 0 6px #000;overflow:hidden}
.sw-bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:linear-gradient(90deg,#8d4a00,#ffcf4d,#fff3c4,#ffcf4d);box-shadow:0 0 8px #ffb300;transition:width .35s ease}
.sw-bar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,#fff4 10px 12px)}
.sw-q{min-height:2.6em;max-width:min(620px,86vw);font-size:clamp(13px,2.1vh,18px);font-style:italic;color:#fff3e0;opacity:.9;transition:opacity .4s}
</style>

оге — там его слабость.","Империя пала, но камни Хампи помнят. Сансара вращается: всё созданное разрушится, чтобы родиться вновь.","Богиня Минакши правит здесь. Шакти — сила, без которой Шива — лишь шава, мертвец. Асуры жаждут этой силы.","Здесь встречаются три моря, как ида, пингала и сушумна встречаются в Аджне. Асуры охраняют берег.","Ванары построили мост, написав имя Рамы на камнях — и камни поплыли. Такова сила намы, святого имени.","Равана был великим учёным и бхактой Шивы, но ахамкара — эго — погубило его. Десять голов — десять привязанностей.","Ледяной лингам растёт и убывает с луной. Здесь Шива открыл Парвати тайну бессмертия — Амар Катху.","Манасаровар создан умом Брахмы. Омовение в нём смывает карму семи жизней. Но асуры мутят воды.","Кайлас — обитель Шивы, ось мира, гора Меру. Обход-парикрама очищает душу. Последние стражи тьмы ждут тебя.","За этими вратами — сварга. Но цель йога выше рая: не наслаждение, а освобождение — мокша.","Кали-юга — век тьмы. Её дух питается раздором людей. Только тот, кто раскрыл все семь чакр, может рассеять его."],Mx=["Начни с пранаямы: стой неподвижно и удерживай S — дыхание восполнит прану. Прана — жизненная сила, текущая по 72000 нади.","Асана — третья ступень аштанга-йоги Патанджали: яма, нияма, асана, пранаяма, пратьяхара, дхарана, дхьяна, самадхи.","У алтарей прими позу: нажимай числа чакр от 1 до 7 вовремя. Ошибка разрушит позу — начни заново.","Бандхи — замки энергии: мула-бандха, уддияна-бандха, джаландхара-бандха. Они запирают прану внутри тела.","Перед боем с демоном повтори мантру. Слово «мантра» означает «то, что защищает ум».","Свадхистхана — обитель вкуса и воды. Открыв её, ты сможешь исцелять себя течением влаги жизни.","Агхори не боятся смерти, ибо видят Шиву во всём. Страх — первая преграда для пробуждения Кундалини.","Манипура — «город драгоценностей», огонь в солнечном сплетении. Тапас — внутренний жар аскезы.","Мудры — печати рук. Джняна-мудра соединяет индивидуальное сознание с вселенским.","Прахлада по сами, на 20 с снижает урон вдвое. [3]",price:70,kind:"consumable",key:"3",color:"#cfd8dc"},{id:"diya",name:"Дия Лакшми",sub:"светильник изобилия",desc:"На 60 с монеты и опыт вдвое. [4]",price:90,kind:"consumable",key:"4",color:"#ff9800"},{id:"amrita",name:"Камандалу с амритой",sub:"нектар бессмертия",desc:"Если тело падёт — возвращает к жизни с половиной здоровья. Тратится сам.",price:200,kind:"consumable",color:"#ffd54f"}],hn=i=>Ia.find(f=>f.id===i),gc=[{lon:77.6,lat:29.7,region:"Уттаракханд",info:"«Мировая столица йоги»: здесь Ганга выходит из Гималаев на равнину, а по вечерам на гхатах совершают ганга-арати."},{lon:78.75,lat:29.35,region:"Уттаракханд",info:"Подвесной мост над Гангой. По преданию, здесь Лакшмана переправился через реку по джутовому канату."},{lon:78.3,lat:30.65,region:"Гархвал-Гималаи",info:"Пещера мудреца Васиштхи над Гангой — тысячелетиями здесь медитировали риши и садху."},{lon:79.4,lat:31.15,region:"Уттаракханд, 3100 м",info:"Храм богини Ганги у ледника Гомукх — истока священной реки, низведённой с небес тапасом царя Бхагиратхи."},{lon:75.6,lat:22.2,region:"Мадхья-Прадеш",info:"Древняя Махишмати на Нармаде: каменные гхаты, крепость и храмы, отражённые в широкой реке."},{lon:83,lat:25.3,region:"Уттар-Прадеш",info:"Один из древнейших городов мира. 84 гхата вдоль Ганги и город Шивы, где умерший обретает мокшу."},{lon:87.8,lat:24.1,region:"Западная Бенгалия",info:"Тарапитх — тантрическое шмашана богини Тары, где медитировал безумный святой Бамакхепа."},{lon:79.9,lat:24.85,region:"Мадхья-Прадеш",info:"Храмы X–XI веков династии Чандела — вершина каменной резьбы и гимн единству Шивы и Шакти."},{lon:81.6,lat:19.1,region:"Чхаттисгарх",info:"Древние леса Дандаки, где Рама, Сита и Лакшмана провели годы изгнания среди отшельников и ракшасов."},{lon:78.7,lat:15.1,region:"Андхра-Прадеш",info:"Ахобилам — девять храмов Нарасимхи в горах Налламала, где Вишну вышел из колонны, чтобы сразить Хираньякашипу."},{lon:76.4,lat:15.35,region:"Карнатака",info:"Столица империи Виджаянагара: море валунов, храм Виттхалы и знаменитая каменная колесница."},{lon:78.1,lat:10,region:"Тамилнад",info:"Храм богини Минакши: четырнадцать гопурамов, покрытых тысячами раскрашенных фигур богов и демонов."},{lon:77.5,lat:8.1,region:"Тамилнад",info:"Южная оконечность Индии, где встречаются Аравийское море, Бенгальский залив и Индийский океан."},{lon:79.35,lat:9.25,region:"Рамешварам",info:"Дханушкоди — отсюда, по Рамаяне, ванары построили мост из плавучих камней с именем Рамы."},{lon:80.7,lat:7.5,region:"Шри-Ланка",info:"Остров Раваны. Сигирию, «Львиную скалу» над джунглями, считают одним из его дворцов."},{lon:75.4,lat:34.2,region:"Кашмир, 3900 м",info:"Пещера Амарнатх, где сам собой растёт ледяной лингам и где Шива открыл Парвати тайну бессмертия."},{lon:82.15,lat:30.55,region:"Тибет, 4590 м",info:"Озеро Манасаровар, сотворённое умом Брахмы. Омовение в нём смывает карму семи жизней."},{lon:80.35,lat:31.05,region:"Тибет",info:"Дарчен у подножия Кайласа — начало 52-километровой парикрамы вокруг священной горы."},{lon:83.7,lat:33.4,region:"над горой Меру",info:"По Пуранам, над горой Меру лежат небесные миры богов — Сварга-лока и врата в неё."},{lon:81.3,lat:31.75,region:"Тибет, 6638 м",info:"Кайлас — обитель Шивы и ось мира. Ни один человек не поднимался на его вершину."}],$x=[{after:0,title:"Голос Ганги",place:"Ришикеш, вечернее арати",sky:["#ff8a65","#4a148c"],speakers:{y:{name:"Йог",kind:"yogi",side:"L"},s:{name:"Свами Шивананда",kind:"guru",robe:"#ff8f00",side:"R"}},nodes:{start:{who:"s",text:"Колокола арати стихают, и Ганга уносит тысячи огоньков-дия. Ты прошёл первую асану, сын мой. Скажи, что ты почувствовал, когда тело замерло в позе?",choices:[{text:"Покой. Будто ум стал тихой водой.",next:"calm",reward:{xp:40}},{text:"Силу. Я хочу сражаться с духами!",next:"force"},{text:"Честно? Только боль в коленях.",next:"knees",reward:{coins:30}}]},calm:{who:"s",text:"Вот и первая ступень — читта-вритти-ниродха, успокоение волн ума. Запомни это чувство: оно будет твоим щитом, когда тьма станет гуще.",next:"gift"},force:{who:"s",text:"Сила без покоя — как огонь без светильника: сожжёт и тебя самого. Духи питаются гневом. Не дай им этой пищи.",next:"gift"},knees:{who:"s",text:"Ха! Честность — тоже тапас. Колени привыкнут. Вот, купи себе у торговцев ладду — говорят, сладкое помогает суставам.",next:"gift"},gift:{who:"s",text:"Возьми эту малу. Сто восемь бусин — сто восемь шагов к себе. Духи вышли из шмашаны не случайно: кто-то зовёт их. Иди вверх по течению — и узнаешь.",choices:[{text:"Благодарю, Свамиджи. Ом Тат Сат.",next:"end",reward:{item:"laddu"}},{text:"Кто их зовёт?",next:"who"}]},who:{who:"s",text:"Говорят, в эпоху Кали древние асуры пробуждаются один за другим. Но я лишь старик у реки. Ответы — в горах.",next:"end",reward:{xp:25}},end:{who:"y",text:"Я поклонился, коснувшись стоп учителя, и шагнул в темноту, где уже шептали голодные преты."}}},{after:2,title:"Отшельник в пещере",place:"Пещера Васиштхи",sky:["#263238","#607d8b"],speakers:{y:{name:"Йог",kind:"yogi",side:"L"},r:{name:"Риши Агастья",kind:"guru",robe:"#fafafa",side:"R"}},nodes:{start:{who:"r",text:"Шаги… Не открывая глаз, слышу — ты идёшь без страха, но с тяжестью. Что ты несёшь, путник?",choices:[{text:"Вопросы. Кто пробуждает асуров?",next:"q"},{text:"Голод. Нет ли у вас еды?",next:"food",reward:{prana:!0}},{text:"Ничего. Я пришёл помедитировать рядом.",next:"med",reward:{xp:60}}]},q:{who:"r",text:"Махишасура. Буйвол-демон получил дар от Брахмы: ни бог, ни человек не убьёт его. Он разорвал печати шмашан и зовёт голодных мёртвых в своё войско.",next:"how"},food:{who:"r",text:"В пещере — лишь вода и тишина. Но тишина тоже пища. Сядь, вдохни трижды… Чувствуешь? Прана вернулась.",next:"how"},med:{who:"r",text:"Мудрое желание. Мы сидели молча, и время текло, как ледниковая вода. Когда ты открыл глаза, свеча догорела, а в сердце горел новый огонь.",next:"how"},how:{who:"r",text:"Махишасуру не победить ни богу, ни человеку. Но йог, познавший Атман, — уже ни то, ни другое. Ответь: что ты такое?",choices:[{text:"Я — тело и разум йога.",next:"wrong"},{text:"Нети-нети. Я — не это и не то.",next:"right",reward:{xp:80,coins:50}},{text:"Я — тот, кто сейчас хочет спать.",next:"sleep"}]},wrong:{who:"r",text:"Тогда ты падёшь, как падали цари. Подумай ещё, пока идёшь к Ганготри.",next:"end"},right:{who:"r",text:"Нети-нети… Значит, ты уже на пути. Возьми это — паломники оставили мне сварну, а отшельнику она ни к чему.",next:"end"},sleep:{who:"r",text:"Ха-ха! Даже это — честнее, чем гордыня. Спи. Сон — тоже маленькая смерть, и йог должен не бояться ни одной из них.",next:"end",reward:{prana:!0}},end:{who:"y",text:"Холод пещеры остался позади. Впереди сверкал ледник Гомукх — исток Ганги и, может быть, ответов."}}},{after:4,title:"Последние слова буйвола",place:"Руины Махишмати",sky:["#bf360c","#311b92"],speakers:{y:{name:"Йог",kind:"yogi",side:"L"},m:{name:"Махишасура",kind:"boss",boss:0,side:"R"}},nodes:{start:{who:"m",text:"Хр-р… Ни бог… ни человек… А ты… кто ты, жалкий садху, что сломал мой рог?",choices:[{text:"Я — тот, кто ищет себя.",next:"seek"},{text:"Тот, кому надоели твои духи.",next:"tired"},{text:"Неважно. Скажи, кто стоит за тобой?",next:"who"}]},seek:{who:"m",text:"Ищет… себя… Глупец. Я искал вечности и получил её дар. А теперь… прах. Может, ты и прав.",next:"who"},tired:{who:"m",text:"Ха… Мои духи — лишь дым. Настоящий огонь — впереди. Золотой царь не простит тебе моей смерти.",next:"who"},who:{who:"m",text:"Хираньякашипу… Он ненавидит Вишну и всех, кто молится. Он собирает асуров, чтобы отменить сам дхарму… Ищи его там… где ни день, ни ночь…",choices:[{text:"Обрести тебе мокшу, демон.",next:"moksha",reward:{xp:120}},{text:"Где твоя сокровищница?",next:"gold",reward:{coins:150}}]},moksha:{who:"m",text:"Мокша… для демона?.. Странно… тепло… Тело буйвола рассыпалось золотой пылью, и над руинами пролетела стая белых цапель.",next:"end"},gold:{who:"m",text:"Жадный йог… Ха… Под третьей колонной… Бери… мне больше не нужно… В его голосе впервые не было злобы.",next:"end"},end:{who:"y",text:"Первый асура пал. Но слова «ни день, ни ночь» звенели в ушах, как колокольчик в пустом храме."}}},{after:6,title:"Песня агхори",place:"Шмашана у Тарапитха",sky:["#1a0000","#4e342e"],speakers:{y:{name:"Йог",kind:"yogi",side:"L"},a:{name:"Агхори Бхайрав",kind:"guru",robe:"#424242",side:"R"}},nodes:{start:{who:"a",text:"Хо! Живой в царстве мёртвых! Садись к костру, брат. Пепел тёплый. Боишься?",choices:[{text:"Нет. Смерть — лишь смена одежды.",next:"brave",reward:{xp:70}},{text:"Немного. Здесь пахнет… тленом.",next:"fear"},{text:"Зачем вы живёте среди мёртвых?",next:"why"}]},brave:{who:"a",text:"Гита! Хорошо выучил. Но знать — одно, а сидеть на прахе собственной матери — другое. Посмотрим, как запоёшь у Раваны.",next:"ash"},fear:{who:"a",text:"Тлен — честный запах. Все дворцы мира пахнут так же, только позже. Страх — первая цепь. Порви её здесь — и не будет её нигде.",next:"ash"},why:{who:"a",text:"Шива — Смашана-васин, живущий на кладбищах. Где все бегут, я остаюсь. Где все брезгуют, я вижу Бога. Так проще отличить, что в тебе настоящее.",next:"ash"},ash:{who:"a",text:"Вот вибхути — пепел этого костра. Намажь лоб тремя полосами, и духи отведут взгляд. Но дай что-нибудь взамен — у агхори всё честно.",choices:[{text:"Отдать 40 сварны.",next:"pay",reward:{coins:-40,item:"vibhuti"}},{text:"Спеть ему мантру.",next:"sing",reward:{item:"vibhuti",xp:30}},{text:"Отказаться.",next:"no"}]},pay:{who:"a",text:"Монеты я брошу в огонь — пусть мёртвым будет на что купить сладостей. Ха-ха-ха!",next:"end"},sing:{who:"a",text:"«Ом Намах Шивая…» Твой голос дрожит, но мантра верная. Бери, брат. Песня дороже золота.",next:"end"},no:{who:"a",text:"Свобода выбора — тоже дар Шивы. Иди. Но помни: на костре все равны.",next:"end"},end:{who:"y",text:"Я уходил на рассвете. За спиной агхори всё пел, и пламя костра плясало в такт."}}},{after:9,title:"Мальчик, который молился",place:"У разрушенной колонны дворца",sky:["#f9a825","#3e2723"],speakers:{y:{name:"Йог",kind:"yogi",side:"L"},p:{name:"Бхакта Прахлада",kind:"child",side:"R"}},nodes:{start:{who:"p",text:"Ты победил моего отца… Хираньякашипу был жесток, но он был моим отцом. Ты думаешь, я должен злиться на тебя?",choices:[{text:"Прости. Я не хотел твоей боли.",next:"sorry",reward:{xp:90}},{text:"Он хотел убить тебя за молитву.",next:"truth"},{text:"Это была воля Нарасимхи, не моя.",next:"nara",reward:{xp:50}}]},sorry:{who:"p",text:"Я не злюсь. Нарасимха вышел из колонны в сумерках, на пороге — ни днём, ни ночью, ни внутри, ни снаружи. Ты лишь открыл ему дверь.",next:"gift"},truth:{who:"p",text:"Да. Он бросал меня в огонь и к змеям. Но я всё равно его любил. Бхакти — это любовь, которая не выбирает, кого любить.",next:"gift"},nara:{who:"p",text:"Ты говоришь как мудрец. Вишну действует через всех нас. Даже через демонов — чтобы показать, куда не надо идти.",next:"gift"},gift:{who:"p",text:"Возьми мой камандалу. В нём вода из колонны, откуда вышел Господь. Говорят, она возвращает жизнь. Тебе ещё идти к Ланке…",choices:[{text:"Принять с поклоном.",next:"end",reward:{item:"amrita"}},{text:"Оставь себе — тебе нужнее.",next:"keep",reward:{xp:150,coins:80}}]},keep:{who:"p",text:"Ты отказываешься от бессмертия ради ребёнка? Тогда возьми хотя бы мои монеты — мне их дарили на праздник Холи.",next:"end"},end:{who:"y",text:"Мальчик сложил ладони в намасте. За его спиной вставало солнце, и золото дворца больше не казалось зловещим."}}},{after:13,title:"Брат врага",place:"Берег у моста Рамы",sky:["#01579b","#880e4f"],speakers:{y:{name:"Йог",kind:"yogi",side:"L"},v:{name:"Вибхишана",kind:"demon",demon:"rakshasa",side:"R"}},nodes:{start:{who:"v",text:"Стой, йог! Не поднимай посох. Я — ракшаса, но я не служу Раване. Я его брат, Вибхишана.",choices:[{text:"Ракшасам нельзя верить!",next:"distrust"},{text:"Говори. Я слушаю.",next:"listen",reward:{xp:60}},{text:"Брат? Значит, ты знаешь его слабость.",next:"weak"}]},distrust:{who:"v",text:"Рама тоже мог так сказать. Но он принял меня — и потому победил. Суди не по клыкам, а по делам.",next:"weak"},listen:{who:"v",text:"Мой брат — великий учёный и бхакта Шивы. Но гордыня съела его, как термит — дерево. Десять голов — десять привязанностей.",next:"weak"},weak:{who:"v",text:"Его головы отрастают, пока жива ахамкара — эго. Бей не по головам, а в сердце. И держись подальше от его лучников на стенах.",choices:[{text:"Пойдём со мной на Ланку!",next:"join"},{text:"Чем отплатить тебе?",next:"pay",reward:{coins:120}},{text:"Спасибо, брат.",next:"end",reward:{xp:80}}]},join:{who:"v",text:"Я не могу поднять руку на брата. Но возьми эту раковину — её звук переносит воина туда, куда устремлён ум. Мне она больше не нужна.",next:"end",reward:{item:"manovega"}},pay:{who:"v",text:"Мне не нужно золото — у Ланки его слишком много. Возьми его себе, оно жжёт мне руки.",next:"end"},end:{who:"y",text:"Камни моста с именем Рамы покачивались на волнах. Впереди дымилась золотая крепость."}}},{after:16,title:"Голос озера",place:"Манасаровар, лунная ночь",sky:["#1a237e","#000000"],speakers:{y:{name:"Йог",kind:"yogi",side:"L"},d:{name:"Голос Шивы",kind:"deity",sym:"lingam",color:"#b3e5fc",side:"R"}},nodes:{start:{who:"d",text:"Ты пришёл далеко, малый. Шесть лотосов раскрыты. Скажи — зачем тебе седьмой?",choices:[{text:"Чтобы победить дух Кали-юги.",next:"fight"},{text:"Чтобы стать свободным.",next:"free",reward:{xp:120}},{text:"Я уже не знаю. Просто иду.",next:"walk",reward:{xp:200}}]},fight:{who:"d",text:"Победа — тоже привязанность. Дух Кали питается борьбой. Чем сильнее бьёшь, тем он сытее. Подумай об этом на вершине.",next:"gift"},free:{who:"d",text:"Свобода не в конце пути. Она в каждом шаге, если шаг сделан без жажды плода. Так учил Кришна.",next:"gift"},walk:{who:"d",text:"Вот это — самый честный ответ за тысячу лет. Кто просто идёт, тот уже пришёл.",next:"gift"},gift:{who:"d",text:"Вода Манасаровара смывает карму семи жизней. Возьми её. И помни: я в тебе, а не на вершине.",choices:[{text:"Ом Намах Шивая.",next:"end",reward:{item:"gangajal",prana:!0}},{text:"Почему ты помогаешь мне?",next:"why"}]},why:{who:"d",text:"Потому что ты — это я, забывший себя. Озеро замерцало, и в нём отразились семь лотосов — шесть светились, седьмой ждал.",next:"end",reward:{item:"gangajal",xp:100}},end:{who:"y",text:"Луна легла на воду дорожкой. Где-то наверху, над облаками, ждала вершина Кайласа."}}}],Ad=i=>$x.find(f=>f.after===i),f0={0:{type:"kill",n:3,why:"Бхуты тревожат садхану у Ганги — изгоните их, прежде чем идти дальше."},1:{type:"item",item:"bilva",n:4,why:"Для пуджи Шиве в ашраме нужны листья бильвы."},2:{type:"lotus",n:4,why:"Пещерный риши примет лишь того, кто принесёт лотосы."},3:{type:"killKind",kind:"preta",n:3,why:"Голодные преты оскверняют исток Ганги."},5:{type:"item",item:"diya",n:4,why:"Зажгите светильники для вечернего арати на гхатах."},6:{type:"killKind",kind:"vetala",n:3,why:"Веталы вселились в мертвецов шмашаны."},7:{type:"chest",n:2,why:"Храмовые сокровища должны вернуться к служителям."},8:{type:"kill",n:6,why:"Ракшасы Дандаки охотятся на отшельников."},10:{type:"item",item:"shankha",n:4,why:"Звук раковин пробудит спящие руины Хампи."},11:{type:"lotus",n:6,why:"Богиня Минакши ждёт гирлянду из лотосов."},12:{type:"killKind",kind:"asura",n:3,why:"Асуры стерегут берег трёх морей."},13:{type:"chest",n:3,why:"Ванары спрятали дары для строителей моста."},15:{type:"item",item:"kalasha",n:4,why:"Принесите воду Ганги, чтобы омыть ледяной лингам."},16:{type:"lotus",n:7,why:"Священные лотосы Манасаровара откроют путь к Кайласу."},17:{type:"kill",n:10,why:"Последние стражи тьмы преграждают парикраму."},18:{type:"item",item:"grantha",n:5,why:"Соберите свитки мантр — без них врата Сварги не отворятся."}},Qd=[{far:"himalaya",mid:"ashram",water:"river",weather:"petals",ground:"grass",toran:!0},{far:"himalaya",mid:"temples",water:"river",weather:"petals",ground:"stone",toran:!0},{far:"himalaya",mid:"cave",water:"abyss",weather:"mist",ground:"rock"},{far:"him
